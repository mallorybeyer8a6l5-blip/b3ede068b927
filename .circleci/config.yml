      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load hover model
          command: |
            printf 'wingbeat 4\n' > kes.cfg
      - run:
          name: Build flight dynamics
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Kestrel -j2
      - run:
          name: Stabilize kestrel hover
          command: LIONSS_LP=1 ./build/Kestrel --config kes.cfg --wind 6
  FpgaBitgen:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
