version: 2.1

jobs:
  flashattn-v2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Shape tensors
          command: |
            printf 'seq 2048\nheads 32\n' > attn.cfg
      - run:
          name: Build attention kernel
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flashattn-v2 -j2
      - run:
          name: Run flash attention v2
          command: LIONSS_LP=1 ./build/flashattn-v2 --conf attn.cfg --causal
  feldspar:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load crystal
          command: |
            printf 'twins 2\n' > feld.cfg
      - run:
          name: Build crystal grower
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target feldspar -j2
      - run:
          name: Grow feldspar twin
          command: LIONSS_LP=1 ./build/feldspar --config feld.cfg --rate 0.1
